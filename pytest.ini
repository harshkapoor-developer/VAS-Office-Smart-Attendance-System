[pytest]
# Ensures `pytest` run from the project root discovers everything under
# tests/ without needing each test file's manual sys.path hack (that hack
# is kept too, since it also lets each file run standalone via
# `python tests/test_x.py` - both invocation styles are supported).
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    gui: tests that require a real or virtual (Xvfb) display; auto-skipped if none is available.
    slow: tests that are slow by design (e.g. PBKDF2 hashing in auth tests) - not skipped by default, just documented.

# Quiet, readable output; stop after 10 failures rather than burying one
# real failure under a wall of cascading ones.
addopts = -v --maxfail=10 --strict-markers

filterwarnings =
    ignore::DeprecationWarning
